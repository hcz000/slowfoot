<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>运营总览 · SlowFoot</title>
    <link rel="stylesheet" href="../css/admin-refresh.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f7fb; color: #17243a; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
        .overview { max-width: 1440px; margin: 0 auto; padding: 30px 32px 38px; }
        .overview-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
        .overline { margin: 0 0 8px; color: #7285a2; font-size: 11px; font-weight: 750; letter-spacing: .16em; }
        h1 { margin: 0; color: #17243a; font-size: 27px; letter-spacing: -.04em; }
        .subtitle { margin: 8px 0 0; color: #7b899d; font-size: 13px; }
        .refresh { display: inline-flex; align-items: center; gap: 9px; height: 40px; padding: 0 14px; border: 1px solid #dfe6ef; border-radius: 9px; background: #fff; color: #52637b; cursor: pointer; font-size: 13px; font-weight: 600; transition: .16s; }
        .refresh:hover { border-color: #a9c4ef; color: #286fe8; box-shadow: 0 4px 12px rgba(40,111,232,.08); }
        .refresh svg { width: 16px; height: 16px; }
        .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
        .stat-card { position: relative; min-height: 158px; overflow: hidden; padding: 20px; border: 1px solid #e5eaf1; border-radius: 14px; background: #fff; box-shadow: 0 6px 20px rgba(23,36,58,.035); }
        .stat-card::after { position: absolute; right: -27px; bottom: -44px; width: 120px; height: 120px; border-radius: 50%; background: var(--wash); content: ""; }
        .stat-top { display: flex; align-items: center; justify-content: space-between; }
        .stat-label { color: #75839a; font-size: 13px; }
        .stat-icon { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 11px; background: var(--wash); color: var(--accent); }
        .stat-icon svg { width: 19px; height: 19px; }
        .stat-value { position: relative; z-index: 1; margin: 22px 0 0; color: #17243a; font-size: 34px; font-weight: 750; letter-spacing: -.05em; }
        .stat-foot { position: relative; z-index: 1; margin: 5px 0 0; color: #9aa5b4; font-size: 11px; }
        .overview-bottom { display: grid; grid-template-columns: 1.45fr 1fr; gap: 16px; margin-top: 18px; }
        .info-card { min-height: 208px; padding: 22px; border: 1px solid #e5eaf1; border-radius: 14px; background: #fff; box-shadow: 0 6px 20px rgba(23,36,58,.035); }
        .info-card h2 { margin: 0; font-size: 15px; }
        .info-card p { color: #7c899c; font-size: 13px; line-height: 1.8; }
        .health { display: inline-flex; align-items: center; gap: 8px; margin-top: 9px; padding: 8px 11px; border-radius: 8px; background: #eef9f4; color: #258768; font-size: 12px; font-weight: 650; }
        .health-dot { width: 7px; height: 7px; border-radius: 50%; background: #34bd8b; }
        .quick-list { display: grid; gap: 10px; margin-top: 18px; }
        .quick-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 13px; border: 1px solid #edf0f5; border-radius: 9px; color: #42536c; font-size: 13px; }
        .quick-item span:last-child { color: #94a1b2; font-size: 12px; }
        .load-error { display: none; margin-top: 18px; padding: 12px 14px; border: 1px solid #f1d3d2; border-radius: 9px; background: #fff5f4; color: #a74c47; font-size: 13px; }
        .load-error.show { display: block; }
        @media (max-width: 1050px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } }
        @media (max-width: 640px) { .overview { padding: 22px 16px; } .overview-head { align-items: flex-start; flex-direction: column; } .stats, .overview-bottom { grid-template-columns: 1fr; } .stat-card { min-height: 145px; } }
    </style>
</head>
<body>
<main class="overview">
    <header class="overview-head">
        <div><p class="overline">SLOWFOOT / WORKSPACE</p><h1>运营总览</h1><p class="subtitle">查看平台内容与审核数据，掌握当前运营状态。</p></div>
        <button type="button" class="refresh" id="refreshStats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.7 9a7 7 0 0 1 11.8-2L20 12M4 12l2.5 5a7 7 0 0 0 11.8-2"/></svg>刷新数据</button>
    </header>
    <section class="stats" aria-label="视频审核统计">
        <article class="stat-card" style="--accent:#3478ed;--wash:#edf4ff"><div class="stat-top"><span class="stat-label">视频总数</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg></span></div><p class="stat-value" id="allCount">—</p><p class="stat-foot">平台累计作品记录</p></article>
        <article class="stat-card" style="--accent:#24a77a;--wash:#eaf8f2"><div class="stat-top"><span class="stat-label">审核通过</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16.5 9"/></svg></span></div><p class="stat-value" id="successCount">—</p><p class="stat-foot">已通过内容审核</p></article>
        <article class="stat-card" style="--accent:#e39a35;--wash:#fff6e8"><div class="stat-top"><span class="stat-label">审核处理中</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span></div><p class="stat-value" id="processCount">—</p><p class="stat-foot">等待审核结论</p></article>
        <article class="stat-card" style="--accent:#825ee8;--wash:#f2efff"><div class="stat-top"><span class="stat-label">PASS 统计</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5m0 14h17M8 15l4-4 3 2 5-7"/></svg></span></div><p class="stat-value" id="passCount">—</p><p class="stat-foot">审核策略自动通过计数</p></article>
    </section>
    <section class="overview-bottom">
        <article class="info-card"><h2>工作台状态</h2><p>管理菜单与内容审核服务已连接。数据由后台统计接口实时读取。</p><span class="health"><i class="health-dot"></i><span id="connectionText">正在连接统计服务</span></span><div class="load-error" id="loadError" role="alert"></div></article>
        <article class="info-card"><h2>常用入口</h2><p>从左侧导航进入对应的管理模块。</p><div class="quick-list"><div class="quick-item"><span>内容管理</span><span>作品与分类</span></div><div class="quick-item"><span>用户管理</span><span>账号与角色</span></div><div class="quick-item"><span>系统设置</span><span>审核与平台配置</span></div></div></article>
    </section>
</main>
<script src="../api/urlConfig.js"></script>
<script>
(function () {
    var fields = ['allCount', 'successCount', 'processCount', 'passCount'];
    var button = document.getElementById('refreshStats');
    var error = document.getElementById('loadError');
    var connection = document.getElementById('connectionText');
    function loadStats() {
        button.disabled = true;
        error.classList.remove('show');
        connection.textContent = '正在读取最新数据';
        fetch(ipURL + '/admin/work/statistics', { method: 'GET', headers: { token: localStorage.getItem('token') || '' } })
            .then(function (response) {
                return response.json().then(function (data) {
                    if (!response.ok || !data.success) throw new Error(data.message || '统计数据加载失败');
                    return data.data || {};
                });
            })
            .then(function (data) {
                fields.forEach(function (field) { document.getElementById(field).textContent = Number(data[field] || 0).toLocaleString('zh-CN'); });
                connection.textContent = '数据已更新 · ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            })
            .catch(function (failure) {
                connection.textContent = '统计服务暂不可用';
                error.textContent = failure.message || '请求失败，请稍后重试。';
                error.classList.add('show');
            })
            .finally(function () { button.disabled = false; });
    }
    button.addEventListener('click', loadStats);
    loadStats();
})();
</script>
</body>
</html>
