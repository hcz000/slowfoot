<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>layui</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../../lib/layui-v2.7.3/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="../../css/public.css" media="all">

    <link rel="stylesheet" href="../../css/admin-refresh.css?v=20261011">
</head>
<body>

<div class="layuimini-container">
    <div class="layuimini-main">

        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">作品号</label>
                            <div class="layui-input-inline">
                                <input type="text" name="workNo" autocomplete="off" class="layui-input" id="workNo">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">作品名称</label>
                            <div class="layui-input-inline">
                                <input type="text" name="title" autocomplete="off" class="layui-input" id="title">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="button" class="layui-btn layui-btn-primary"  lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i> 搜 索</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>

        <table class="layui-hide" id="currentTableId" lay-filter="currentTableFilter"></table>

        <script type="text/html" id="currentTableBar">
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="violations">下架</a>
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="audit">审核</a>
            <a class="layui-btn layui-btn-normal layui-btn-danger layui-btn-xs data-count-edit" lay-event="delete">删除</a>
        </script>
    </div>
</div>


<script src="../../lib/layui-v2.6.3/layui.js"></script>
<script src="../../js/lay-config.js?v=1.0.4" charset="utf-8"></script>
<script src="../../lib/jquery-3.4.1/jquery-3.4.1.min.js"></script>

<script src="../../api/urlConfig.js"></script>
<script src="../../js/auth.js"></script>
<script type="text/javascript">


    layui.use(['form', 'table'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table,
            layer = layui.layer;

        table.render({
            elem: '#currentTableId',
            url:ipURL+"/admin/work/page",
            headers:{token:localStorage.token},
            parseData: function(res){ //res 即为原始返回的数据
                return {
                    "code": res.success ? 0 : 1, //解析接口状态
                    "msg": res.message, //解析提示文本
                    "count": res.meta.total, //解析数据长度
                    "data": res.data,//解析数据列表

                };

            },

            response: {
                statusCode: 0//规定成功的状态码，默认：0
            },
            text:{none: '无数据'},
            defaultToolbar: ['filter', 'exports', 'print', {
                title: '提示',
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            cols: [[
                {type: "checkbox", width: 50},
                { field: 'id', title: 'ID' ,sort: true,hide:true},
                { field: 'workNo', title: '作品号' },
                { field: 'workType', title: '作品类型', templet: function (row) { return ({ VIDEO: '视频', IMAGE: '图片', TEXT: '文章' })[row.workType] || row.workType; } },
                { field: 'title', title: '名称' },
                { field: 'auditStateName', title: '审核状态' },
                { field: 'openName', title: '作品状态' },
                { field: 'auditMsg', title: '审核消息' },
                { field: 'typeName', title: '分类' },
                { field: 'userName', title: '上传者' },
                {title: '操作', minWidth: 150, toolbar: '#currentTableBar', align: "center"}
            ]],
            limits: [10, 15, 20, 25, 50, 100],
            limit: 15,
            page: true,
            skin: 'line'
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            var workNo = $('input[id="workNo"]').val()
            var title = $('input[id="title"]').val()
            //执行搜索重载
            table.reload('currentTableId', {

                page: {
                    curr: 1
                }
                , where: {
                    workNo: workNo,
                    title:title
                }
            });
            return false;
        });

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data
            if(obj.event == 'delete'){
                layer.confirm('确定删除选中的作品吗?', function(index){
                    $.ajax({
                        url: ipURL + '/admin/work/'+data.id,
                        method: 'delete',
                        beforeSend: function (request) {
                            request.setRequestHeader("token", localStorage.token);
                        },
                        success: function (res) {
                            layer.msg(res.message);
                            layer.close(index);
                            table.reload('currentTableId');
                        },
                        error: function (data) {
                            layer.msg(data.message);
                        }
                    });
                });
            }else if(obj.event == 'audit'){
                openAudit(data);
            }else if(obj.event == 'violations'){
                layer.confirm('确定下架选中的作品吗?', function(index){
                    $.ajax({
                        url: ipURL + '/admin/work/violations/'+data.id,
                        method: 'post',
                        beforeSend: function (request) {
                            request.setRequestHeader("token", localStorage.token);
                        },
                        success: function (res) {
                            layer.msg(res.message);
                            layer.close(index);
                            table.reload('currentTableId');
                        },
                        error: function (data) {
                            layer.msg(data.message);
                        }
                    });
                });
            }
        });

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
            });
        }

        function renderAuditDetail(work) {
            var typeNames = { VIDEO: '视频作品', IMAGE: '图片作品', TEXT: '文字作品' };
            var assets = work.assets || [];
            var media = '';
            if (work.workType === 'TEXT') {
                media = '<pre class="audit-work-text">' + escapeHtml(work.content || '正文为空') + '</pre>';
            } else if (work.workType === 'IMAGE') {
                var images = assets.filter(function (asset) { return asset.assetType === 'IMAGE'; });
                media = images.length
                    ? '<div class="audit-work-images">' + images.map(function (asset) { return '<img src="' + escapeHtml(asset.url) + '" alt="作品图片">'; }).join('') + '</div>'
                    : '<p>没有可预览的图片资源。</p>';
            } else if (work.workType === 'VIDEO') {
                var video = assets.find(function (asset) { return asset.assetType === 'VIDEO'; });
                var cover = assets.find(function (asset) { return asset.assetType === 'COVER'; });
                media = video
                    ? '<video class="audit-work-video" controls preload="metadata" poster="' + escapeHtml(cover ? cover.url : '') + '" src="' + escapeHtml(video.url) + '"></video>'
                    : '<p>没有可预览的视频资源。</p>';
            }
            return '<div class="audit-work-detail">' +
                '<div class="audit-work-type">' + escapeHtml(typeNames[work.workType] || work.workType || '未知类型') + '</div>' +
                '<h2>' + escapeHtml(work.title || '未命名作品') + '</h2>' +
                (work.description ? '<p class="audit-work-description">' + escapeHtml(work.description) + '</p>' : '') +
                media + '</div>';
        }

        function submitAudit(id, auditStatus, auditMsg, onSuccess) {
            $.ajax({
                url: ipURL + '/admin/work/audit',
                method: 'post',
                data: JSON.stringify({ id: id, auditStatus: auditStatus, auditMsg: auditMsg || '' }),
                contentType: 'application/json',
                beforeSend: function (request) { request.setRequestHeader('token', localStorage.token); },
                success: function (res) {
                    layer.msg(res.message || '作品审核完成');
                    if (onSuccess) onSuccess();
                    table.reload('currentTableId');
                },
                error: function (xhr) { layer.msg(xhr.responseJSON && xhr.responseJSON.message || '审核操作失败'); }
            });
        }

        function openAudit(row) {
            $.ajax({
                url: ipURL + '/admin/work/' + row.id,
                method: 'get',
                beforeSend: function (request) { request.setRequestHeader('token', localStorage.token); },
                success: function (res) {
                    if (!res.success || !res.data) { layer.msg(res.message || '读取作品内容失败'); return; }
                    var work = res.data;
                    var dialogIndex = layer.open({
                        type: 1,
                        title: '审核' + (({ VIDEO: '视频', IMAGE: '图片', TEXT: '文章' })[work.workType] || '作品'),
                        area: ['760px', '82vh'],
                        content: renderAuditDetail(work),
                        btn: ['通过', '驳回', '关闭'],
                        btn1: function () {
                            submitAudit(work.id, 0, '', function () { layer.close(dialogIndex); });
                            return false;
                        },
                        btn2: function () {
                            layer.prompt({ title: '填写驳回原因', formType: 2 }, function (reason, promptIndex) {
                                submitAudit(work.id, 2, reason, function () {
                                    layer.close(promptIndex);
                                    layer.close(dialogIndex);
                                });
                            });
                            return false;
                        }
                    });
                },
                error: function (xhr) { layer.msg(xhr.responseJSON && xhr.responseJSON.message || '读取作品内容失败'); }
            });
        }

    })

</script>



</body>
<style type="text/css">
    .myData .layui-form-item{
        margin: 20px 100px 10px 45px;
    }
    .myData .layui-form-label{
        width: 80px;
    }
</style>

<style>
    .audit-work-detail { max-height: 67vh; padding: 4px 10px 12px; overflow: auto; color: #27313d; }
    .audit-work-type { display: inline-block; padding: 5px 9px; color: #1c65a6; background: #eaf4fc; border-radius: 5px; font-size: 12px; }
    .audit-work-detail h2 { margin: 14px 0 8px; font-size: 20px; }
    .audit-work-description { color: #687586; white-space: pre-wrap; }
    .audit-work-text { max-height: 48vh; padding: 16px; overflow: auto; background: #f5f7fa; border-radius: 7px; font: inherit; line-height: 1.8; white-space: pre-wrap; }
    .audit-work-images { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .audit-work-images img { width: 100%; max-height: 48vh; object-fit: contain; background: #121820; border-radius: 5px; }
    .audit-work-video { display: block; width: 100%; max-height: 52vh; background: #080a0d; }
</style>

<form class="layui-form myData" action="save" method="post" lay-filter="stuform" id="audit" style="display: none">
    <input type="hidden" name="id"  />

    <div class="layui-form-item">
        <label class="layui-form-label">菜单名称：</label>
        <div class="layui-input-block">
            <input type="text" name="name" lay-verify="required"  class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">菜单类型</label>
        <div class="layui-input-block">
            <input type="radio" name="isMenu" value="0" title="菜单">
            <input type="radio" name="isMenu" value="1" title="按钮" checked>
            <input type="radio" name="isMenu" value="-1" title="目录">
        </div>
    </div>

</form>



</html>
